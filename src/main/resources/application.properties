
# Spring Application Name
spring.application.name=JouleTracker Platform

# Default Profile
spring.profiles.default=dev

# MySQL DataSource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/jouletracker_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=com.jouletracker.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT Configuration
authorization.jwt.secret=${JWT_SECRET:jouletracker-dev-secret-key-change-in-production-must-be-at-least-256-bits-long}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# Brevo Transactional Email Properties
brevo.api-key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:no-reply@jouletracker.com}
brevo.sender.name=${BREVO_SENDER_NAME:JouleTracker Platform}
brevo.api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}

# Frontend and Verification URLs
application.frontend-url=${FRONTEND_BASE_URL:http://localhost:4200}
application.email-verification-url=${EMAIL_VERIFICATION_URL:${application.frontend-url}/verify-email}

# IAM Verification Token Properties
iam.verification-token.validity-hours=${IAM_VERIFICATION_TOKEN_VALIDITY_HOURS:24}

# Internationalization
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Virtual Threads
spring.threads.virtual.enabled=true
