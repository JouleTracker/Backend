# Production profile
# Require an explicit JDBC URL rather than falling back to the local development database.
spring.datasource.url=${DB_URL}

# Production-lean JPA behavior (override JPA_DDL_AUTO=validate once initial schema exists if desired)
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# App port
server.port=${PORT:8080}

# JWT secret must be provided as an environment variable in production.
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# Email delivery via Brevo (optional if BREVO_API_KEY is left blank; registrations stay allowed)
brevo.api-key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:no-reply@jouletracker.com}
brevo.sender.name=${BREVO_SENDER_NAME:JouleTracker Platform}
application.frontend-url=${FRONTEND_BASE_URL}
application.email-verification-url=${EMAIL_VERIFICATION_URL:${application.frontend-url}/verify-email}
iam.verification-token.validity-hours=${IAM_VERIFICATION_TOKEN_VALIDITY_HOURS:24}

# Optional idempotent demo seeding in production (set SEED_DEMO_DATA=true on first deploy if desired)
app.seed-demo-data=${SEED_DEMO_DATA:false}

