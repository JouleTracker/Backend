# Production profile (Render + Supabase PostgreSQL)
# Require an explicit JDBC URL rather than falling back to local defaults.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Production-lean JPA behavior (override JPA_DDL_AUTO=update on first bootstrap if needed)
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# App port
server.port=${PORT:8080}

# JWT secret must be provided as an environment variable in production.
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# Production email and frontend configuration are mandatory; missing values fail startup.
brevo.api-key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME}
application.frontend-url=${FRONTEND_BASE_URL}
application.email-verification-url=${EMAIL_VERIFICATION_URL:}
application.password-reset-url=${PASSWORD_RESET_URL:}
iam.verification-token.validity-hours=${IAM_VERIFICATION_TOKEN_VALIDITY_HOURS:24}
iam.password-reset-token.validity-minutes=${IAM_PASSWORD_RESET_TOKEN_VALIDITY_MINUTES:30}
