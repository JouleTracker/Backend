# Production profile
# Require an explicit JDBC URL rather than falling back to the local development database.
spring.datasource.url=${DB_URL}

# Production-lean JPA behavior
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# App port
server.port=${PORT:8080}

# JWT secret must be provided as an environment variable in production.
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS}

# Production email configuration is mandatory; missing secrets must fail startup.
brevo.api-key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME}
application.frontend-url=${FRONTEND_BASE_URL}
application.email-verification-url=${EMAIL_VERIFICATION_URL}
iam.verification-token.validity-hours=${IAM_VERIFICATION_TOKEN_VALIDITY_HOURS:24}

