# Development profile
# Database settings are shared with application.properties and use DB_URL, DB_USERNAME, and DB_PASSWORD.

# Developer-friendly JPA behavior
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# App port
server.port=${PORT:8080}

# Demo data seeding enabled by default in dev profile
app.seed-demo-data=${SEED_DEMO_DATA:true}
