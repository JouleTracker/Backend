# Development profile
# Database settings are inherited from application.properties using DB_URL, DB_USERNAME, and DB_PASSWORD.

# Developer-friendly JPA behavior for Supabase PostgreSQL schema sync
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# App port
server.port=${PORT:8081}
