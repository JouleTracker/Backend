# Test profile configuration with in-memory H2 database
spring.datasource.url=jdbc:h2:mem:jouletrackerdb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

authorization.jwt.secret=TestSecretKeyForTestingPurposesMustBeAtLeast32BytesLong123456
authorization.jwt.expiration.days=1

brevo.api-key=test-api-key
brevo.sender.email=test@jouletracker.com
brevo.sender.name=JouleTracker Test
brevo.api-url=http://localhost:8089/v3/smtp/email

application.frontend-url=http://localhost:4200
application.email-verification-url=http://localhost:4200/verify-email

iam.verification-token.validity-hours=24
